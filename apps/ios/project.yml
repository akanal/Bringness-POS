name: BringnessPOS
options:
  bundleIdPrefix: de.bringness
  deploymentTarget:
    iOS: "16.0"
targets:
  BringnessPOS:
    type: application
    platform: iOS
    sources: [BringnessPOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.bringness.pos
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: Bringness POS
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Fotos für Artikel und Belege aufnehmen.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Artikelbilder für Bringness POS auswählen.
schemes:
  BringnessPOS:
    build:
      targets:
        BringnessPOS: all
