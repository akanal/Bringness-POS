<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bringness POS · Kellner</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui,Arial;background:#f3f6f8;color:#182b3d}header{background:#142536;color:white;padding:17px 22px;display:flex;justify-content:space-between;align-items:center}header b{font-size:21px}main{max-width:1100px;margin:24px auto;padding:0 16px}.card{background:white;border:1px solid #dce3e9;border-radius:15px;padding:20px;margin-bottom:15px}input,select,button{font:inherit;padding:12px;border:1px solid #cbd6df;border-radius:9px}input{width:100%;margin:6px 0 14px}button{cursor:pointer;background:white}button.primary{background:#147d54;color:white;border-color:#147d54}button:disabled{opacity:.45}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.tile{min-height:105px;text-align:left}.tile strong{display:block;font-size:19px}.muted{color:#687887;font-size:14px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.item{border-top:1px solid #e8edf1;padding:12px 0}.item input{width:75px;margin:0}.error{color:#b52424}.ok{color:#137d52}#app[hidden],#login[hidden],#passwordBox[hidden],#detail[hidden]{display:none}a{color:inherit}</style></head><body><header><b>Bringness <span style="color:#ff914d">POS</span> · Service</b><button id="logout" style="display:none">Abmelden</button></header><main><section id="login" class="card"><h2>Kellner-Anmeldung</h2><form id="loginForm"><label>E-Mail<input id="email" type="email" required autocomplete="username"></label><label>Passwort<input id="password" type="password" required autocomplete="current-password"></label><button class="primary">Anmelden</button></form><p id="loginMsg" class="error"></p></section><section id="passwordBox" class="card" hidden><h2>Erstpasswort ändern</h2><p>Bitte vergib ein persönliches Passwort, bevor du Bestellungen aufnimmst.</p><form id="passwordForm"><label>Bisheriges Passwort<input id="oldPassword" type="password" required></label><label>Neues Passwort (mindestens 12 Zeichen)<input id="newPassword" type="password" minlength="12" required></label><button class="primary">Passwort ändern</button></form><p id="passwordMsg" class="error"></p></section><section id="app" hidden><div class="row"><div><h2 id="restaurantName"></h2><p id="welcome" class="muted"></p></div><button id="reload">Aktualisieren</button></div><p id="message" role="status"></p><div id="tables" class="grid"></div><section id="detail" class="card" hidden><div class="row"><h2 id="tableName"></h2><button id="back">← Tische</button></div><h3>Offene Bestellungen</h3><div id="orders"></div><h3>Neue Bestellung aufnehmen</h3><div id="products"></div><div class="row"><strong id="total">0,00 €</strong><button id="send" class="primary">Bestellung aufnehmen</button></div></section></section></main><script src="/service/app.js?v=20260923-1"></script></body></html>
