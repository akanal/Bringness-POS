<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bringness · Center</title>
<style>body{font:18px system-ui;background:#f7f4f0;color:#232323;margin:0}main{max-width:760px;margin:auto;padding:24px}button{font:inherit;padding:18px;border:1px solid #ddd;border-radius:14px;background:white;cursor:pointer;text-align:left}#restaurants{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.dish{background:white;border-radius:14px;padding:18px;margin:12px 0}small{display:block;color:#555}#back{margin-bottom:14px}#status{padding:16px;background:#fff1d8;border-radius:14px}h1{color:#d35c13}</style></head>
<body><main><h1>Bringness Center</h1><p id="place"></p><p id="status" role="status">Restaurants werden geladen …</p><button id="back" hidden>← Restaurants</button><div id="restaurants"></div><section id="menu"></section><section id="cart" hidden><h2>Warenkorb</h2><div id="cartItems"></div><p id="cartTotal" aria-live="polite"></p><button id="checkout" disabled>Zur Zahlung</button></section></main>
<script type="module">
async function request(url,options={}){
 const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),15000);
 try{const response=await fetch(url,{...options,signal:controller.signal});const data=await response.json();return {ok:response.ok,status:response.status,json:async()=>data};}
 finally{clearTimeout(timeout);}
}

const code=new URLSearchParams(location.search).get('code')||'';
const place=document.getElementById('place'),status=document.getElementById('status'),list=document.getElementById('restaurants'),menu=document.getElementById('menu'),back=document.getElementById('back');
async function api(endpoint,restaurantId){const u=new URL('/api/v1/guest/center/'+endpoint,location.origin);u.searchParams.set('code',code);if(restaurantId)u.searchParams.set('restaurantId',restaurantId);u.searchParams.set('lang',navigator.language||'de');const r=await request(u,{cache:'no-store'}),data=await r.json();if(!r.ok)throw Error(data.error||'Laden fehlgeschlagen');return data;}
let selectedRestaurant=null,requestId=crypto.randomUUID(),orderingAvailable=false,submitting=false,submitted=false;const money=cents=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(cents/100);const basket=new Map();const cart=document.getElementById('cart'),cartItems=document.getElementById('cartItems'),checkout=document.getElementById('checkout');
function renderCart(){cart.hidden=!basket.size;cartItems.replaceChildren();for(const [id,item] of basket){const row=element('p',item.quantity+' × '+item.product.name+' · '+money(item.quantity*item.product.price_cents)+' '),remove=element('button','Entfernen');remove.disabled=submitted;remove.onclick=()=>{if(submitted)return;basket.delete(id);requestId=crypto.randomUUID();renderCart();};row.append(remove);cartItems.append(row);}document.getElementById('cartTotal').textContent='Gesamt: '+money([...basket.values()].reduce((sum,item)=>sum+item.quantity*item.product.price_cents,0));checkout.disabled=submitting||!orderingAvailable||!basket.size;back.disabled=submitted;menu.querySelectorAll('button').forEach(b=>b.disabled=submitted);}
checkout.onclick=async()=>{if(submitting||!orderingAvailable||!basket.size)return;submitting=true;submitted=true;renderCart();try{const r=await request('/api/v1/guest/center/order',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code,restaurantId:selectedRestaurant,requestId,items:[...basket].map(([productId,item])=>({productId,quantity:item.quantity}))})});const data=await r.json();if(!r.ok){if(data.cartEditable===true)submitted=false;throw Error(data.error||'Bestellung fehlgeschlagen');}if(data.checkoutUrl)location.assign(data.checkoutUrl);else status.textContent='Zahlung wird geprüft. Bitte erneut versuchen.';}catch(e){status.textContent=e.message+(submitted?' Bitte dieselbe Zahlung erneut aufrufen; der Warenkorb bleibt gesichert.':'');}finally{submitting=false;renderCart();}};
function element(tag,text){const el=document.createElement(tag);el.textContent=text;return el;}
async function showMenu(id){if(submitted)return;try{const data=await api('menu',id);if(selectedRestaurant!==id){basket.clear();requestId=crypto.randomUUID();}selectedRestaurant=id;orderingAvailable=data.orderingAvailable===true;renderCart();list.hidden=true;back.hidden=false;menu.replaceChildren(element('h2',data.restaurant.name));for(const p of data.products){const card=element('article','');card.className='dish';card.append(element('h3',p.name),element('p',p.description||''),element('strong',new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(p.price_cents/100)));if(p.ingredients)card.append(element('small','Zutaten: '+p.ingredients));if(p.allergens?.length)card.append(element('small','Allergene: '+p.allergens.map(a=>a.name).join(', ')));if(p.additives?.length)card.append(element('small','Zusatzstoffe: '+p.additives.map(a=>a.name).join(', ')));const add=element('button','In den Warenkorb');add.onclick=()=>{if(submitted)return;const quantity=(basket.get(p.id)?.quantity||0)+1;if(quantity>99)return;basket.set(p.id,{product:p,quantity});requestId=crypto.randomUUID();renderCart();};card.append(add);menu.append(card);}if(!data.products.length)menu.append(element('p','Momentan keine Gerichte verfügbar.'));}catch(e){status.textContent=e.message;}}
back.onclick=()=>{if(submitted)return;basket.clear();renderCart();menu.replaceChildren();list.hidden=false;back.hidden=true;};
try{const data=await api('restaurants');place.textContent=data.center+' · Tisch '+data.table;status.textContent='Speisekarten ansehen. Online-Bestellungen sind hier noch nicht freigeschaltet.';for(const r of data.restaurants){const b=element('button',r.name);b.onclick=()=>showMenu(r.id);list.append(b);}if(!data.restaurants.length)list.append(element('p','Momentan keine Restaurants verfügbar.'));}catch(e){status.textContent=e.message;}
</script></body></html>
