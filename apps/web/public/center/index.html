<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bringness · Center</title>
<style>body{font:18px system-ui;background:#f7f4f0;color:#232323;margin:0}main{max-width:760px;margin:auto;padding:24px}button{font:inherit;padding:18px;border:1px solid #ddd;border-radius:14px;background:white;cursor:pointer;text-align:left}#restaurants{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.dish{background:white;border-radius:14px;padding:18px;margin:12px 0}small{display:block;color:#555}#back{margin-bottom:14px}#status{padding:16px;background:#fff1d8;border-radius:14px}h1{color:#d35c13}</style></head>
<body><main><h1>Bringness Center</h1><p id="place"></p><p id="status" role="status">Restaurants werden geladen …</p><button id="back" hidden>← Restaurants</button><div id="restaurants"></div><section id="menu"></section></main>
<script type="module">
const code=new URLSearchParams(location.search).get('code')||'';
const place=document.getElementById('place'),status=document.getElementById('status'),list=document.getElementById('restaurants'),menu=document.getElementById('menu'),back=document.getElementById('back');
async function api(endpoint,restaurantId){const u=new URL('/api/v1/guest/center/'+endpoint,location.origin);u.searchParams.set('code',code);if(restaurantId)u.searchParams.set('restaurantId',restaurantId);u.searchParams.set('lang',navigator.language||'de');const r=await fetch(u,{cache:'no-store'}),data=await r.json();if(!r.ok)throw Error(data.error||'Laden fehlgeschlagen');return data;}
function element(tag,text){const el=document.createElement(tag);el.textContent=text;return el;}
async function showMenu(id){try{const data=await api('menu',id);list.hidden=true;back.hidden=false;menu.replaceChildren(element('h2',data.restaurant.name));for(const p of data.products){const card=element('article','');card.className='dish';card.append(element('h3',p.name),element('p',p.description||''),element('strong',new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(p.price_cents/100)));if(p.ingredients)card.append(element('small','Zutaten: '+p.ingredients));if(p.allergens?.length)card.append(element('small','Allergene: '+p.allergens.map(a=>a.name).join(', ')));if(p.additives?.length)card.append(element('small','Zusatzstoffe: '+p.additives.map(a=>a.name).join(', ')));menu.append(card);}if(!data.products.length)menu.append(element('p','Momentan keine Gerichte verfügbar.'));}catch(e){status.textContent=e.message;}}
back.onclick=()=>{menu.replaceChildren();list.hidden=false;back.hidden=true;};
try{const data=await api('restaurants');place.textContent=data.center+' · Tisch '+data.table;status.textContent='Speisekarten ansehen. Online-Bestellungen sind hier noch nicht freigeschaltet.';for(const r of data.restaurants){const b=element('button',r.name);b.onclick=()=>showMenu(r.id);list.append(b);}if(!data.restaurants.length)list.append(element('p','Momentan keine Restaurants verfügbar.'));}catch(e){status.textContent=e.message;}
</script></body></html>
