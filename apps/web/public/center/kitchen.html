<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Center-Küche</title><style>body{font:18px system-ui;background:#f7f4f0;color:#222}main{max-width:900px;margin:auto;padding:24px}article{background:white;border-radius:16px;padding:18px;margin:12px 0}button{font:inherit;padding:12px}</style></head><body><main><a href="/pos/">← Kasse</a><h1>Center-Küche</h1><p>Bezahlte Bestellungen nach Zahlungszeitpunkt</p><button id="refresh">Aktualisieren</button><p id="status" role="status"></p><section id="orders"></section></main><script type="module">
const restaurantId=new URLSearchParams(location.search).get('restaurantId'),host=document.getElementById('orders'),status=document.getElementById('status');
function el(tag,text){const n=document.createElement(tag);n.textContent=text;return n;}
async function load(){host.replaceChildren();try{const token=localStorage.getItem('bringness-pos-token');if(!token)throw Error('Bitte zuerst in der Kasse anmelden.');if(!restaurantId)throw Error('Restaurant fehlt im Küchenlink.');const r=await fetch('/api/v1/centers/kitchen?restaurantId='+encodeURIComponent(restaurantId),{headers:{authorization:'Bearer '+token},cache:'no-store'}),data=await r.json();if(!r.ok)throw Error(data.error||'Laden fehlgeschlagen');for(const [index,order] of data.orders.entries()){const card=el('article','');card.append(el('h2',(index+1)+'. Bestellung '+order.id),el('p',order.status==='ready'?'Abholbereit':order.status==='preparing'?'In Zubereitung':'In der Warteschlange'));for(const item of order.items||[])card.append(el('p',item.quantity+' × '+item.name));if(order.status!=='ready'){const button=el('button',order.status==='kitchen'?'Zubereitung starten':'Abholbereit');button.onclick=async()=>{button.disabled=true;try{const r=await fetch('/api/v1/centers/kitchen?restaurantId='+encodeURIComponent(restaurantId),{method:'PUT',headers:{authorization:'Bearer '+token,'content-type':'application/json'},body:JSON.stringify({orderId:order.id,status:order.status==='kitchen'?'preparing':'ready'})});const data=await r.json();if(!r.ok)throw Error(data.error||'Aktion fehlgeschlagen');await load();}catch(e){status.textContent=e.message;button.disabled=false;}};card.append(button);}host.append(card);}status.textContent=data.orders.length?'Zuletzt aktualisiert: '+new Date().toLocaleTimeString('de-DE'):'Keine freigegebenen Center-Bestellungen.';}catch(e){status.textContent=e.message;}}
document.getElementById('refresh').onclick=load;await load();
</script></body></html>
