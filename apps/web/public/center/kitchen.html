<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Center-Küche</title><style>body{font:18px system-ui;background:#f7f4f0;color:#222}main{max-width:900px;margin:auto;padding:24px}article{background:white;border-radius:16px;padding:18px;margin:12px 0}button{font:inherit;padding:12px}</style></head><body><main><a href="/pos/">← Kasse</a><h1>Center-Küche</h1><p>Bezahlte Bestellungen nach Zahlungszeitpunkt</p><button id="refresh">Aktualisieren</button><p id="status" role="status"></p><section id="orders"></section></main><script type="module">
async function request(url,options={}){
 const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),15000);
 try{const response=await fetch(url,{...options,signal:controller.signal});const data=await response.json();return {ok:response.ok,status:response.status,json:async()=>data};}
 finally{clearTimeout(timeout);}
}

const restaurantId=new URLSearchParams(location.search).get('restaurantId'),host=document.getElementById('orders'),status=document.getElementById('status');
function el(tag,text){const n=document.createElement(tag);n.textContent=text;return n;}
let loading=false,acting=false;
async function load(){if(loading||acting)return;loading=true;try{const token=localStorage.getItem('bringness-pos-token');if(!token)throw Error('Bitte zuerst in der Kasse anmelden.');if(!restaurantId)throw Error('Restaurant fehlt im Küchenlink.');const r=await request('/api/v1/centers/kitchen?restaurantId='+encodeURIComponent(restaurantId),{headers:{authorization:'Bearer '+token},cache:'no-store'}),data=await r.json();if(!r.ok)throw Error(data.error||'Laden fehlgeschlagen');const firstWaiting=data.orders.find(order=>order.status==='kitchen')?.id;const cards=[];for(const [index,order] of data.orders.entries()){const card=el('article','');card.append(el('h2',(index+1)+'. Bestellung '+order.id),el('p',order.status==='ready'?'Abholbereit':order.status==='preparing'?'In Zubereitung':'In der Warteschlange'));if(order.collection_number)card.append(el('p','Abholnummer: '+order.collection_number));for(const item of order.items||[])card.append(el('p',item.quantity+' × '+item.name));if(order.status!=='ready'){const button=el('button',order.status==='kitchen'?'Zubereitung starten':'Abholbereit');const blocked=order.status==='kitchen'&&order.id!==firstWaiting;button.dataset.queueBlocked=String(blocked);button.disabled=blocked;if(blocked)card.append(el('p','Eine frühere Bestellung muss zuerst gestartet werden.'));button.onclick=async()=>{if(loading||acting||blocked)return;acting=true;host.querySelectorAll('button').forEach(b=>b.disabled=true);try{const r=await request('/api/v1/centers/kitchen?restaurantId='+encodeURIComponent(restaurantId),{method:'PUT',headers:{authorization:'Bearer '+token,'content-type':'application/json'},body:JSON.stringify({orderId:order.id,status:order.status==='kitchen'?'preparing':'ready'})});const data=await r.json();if(!r.ok)throw Error(data.error||'Aktion fehlgeschlagen');acting=false;await load();}catch(e){status.textContent=e.message;}finally{acting=false;host.querySelectorAll('button').forEach(b=>b.disabled=b.dataset.queueBlocked==='true');}};card.append(button);}cards.push(card);}host.replaceChildren(...cards);status.textContent=data.orders.length?'Zuletzt aktualisiert: '+new Date().toLocaleTimeString('de-DE'):'Keine freigegebenen Center-Bestellungen.';}catch(e){status.textContent='Aktualisierung fehlgeschlagen: '+e.message;}finally{loading=false;}}
document.getElementById('refresh').onclick=load;
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load();});
setInterval(()=>{if(!document.hidden)load();},5000);
await load();
</script></body></html>
