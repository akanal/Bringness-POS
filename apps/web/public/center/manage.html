<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Center · Verträge und Zahlungsstatus</title><style>body{font:18px system-ui;background:#f7f4f0;color:#222}main{max-width:800px;margin:auto;padding:24px}article{background:white;padding:20px;border-radius:16px;margin:16px 0}label{display:block;margin:14px 0}input,select,button{font:inherit;padding:12px;max-width:100%;box-sizing:border-box}button{cursor:pointer}small{display:block;color:#555}</style></head><body><main><a href="/pos/">← Kasse</a><h1>Center-Restaurants</h1><p>Vertragsstatus und Händleranbindung</p><form id="newCenter"><label>Neues Center <input name="name" required maxlength="120"></label><button>Center anlegen</button></form><label>Center <select id="centers"></select></label><p id="status" role="status"></p><section><h2>Gemeinsame Tische</h2><form id="newTable"><label>Tischname <input name="name" required maxlength="80"></label><button>Tisch anlegen</button></form><div id="tables"></div></section><section><h2>Restaurant zuordnen</h2><form id="enroll"><label>Restaurant <select id="ownedRestaurants" required></select></label><button>Diesem Center zuordnen</button></form></section><div id="restaurants"></div></main><script type="module">
const select=document.getElementById('centers'),status=document.getElementById('status'),host=document.getElementById('restaurants');
const contracts={pending:'Vertrag offen',signed:'Vertrag abgeschlossen',suspended:'Vertrag ausgesetzt'},payments={not_connected:'Nicht angebunden',pending:'Prüfung ausstehend',verified:'Vom Anbieter bestätigt',blocked:'Gesperrt'};
async function api(path,options={}){const token=localStorage.getItem('bringness-pos-token');if(!token)throw Error('Bitte zuerst in der Kasse anmelden.');const r=await fetch('/api/v1/centers'+path,{...options,headers:{authorization:'Bearer '+token,'content-type':'application/json'}});const data=await r.json();if(!r.ok)throw Error(data.error||'Anfrage fehlgeschlagen');return data;}
function el(tag,text){const node=document.createElement(tag);node.textContent=text;return node;}
async function load(){host.replaceChildren();try{const data=await api('/'+select.value+'/restaurants');for(const restaurant of data.restaurants){const card=el('article','');card.append(el('h2',restaurant.name),el('p','Zahlungsstatus: '+payments[restaurant.payment_status]));const form=document.createElement('form'),contract=document.createElement('select'),reference=document.createElement('input');for(const [value,label] of Object.entries(contracts)){const option=el('option',label);option.value=value;contract.append(option);}contract.value=restaurant.contract_status;reference.value=restaurant.merchant_reference||'';reference.maxLength=120;const l1=el('label','Vertrag '),l2=el('label','Händlerreferenz ');l1.append(contract);l2.append(reference);form.append(l1,l2,el('small','Nur die Händlerreferenz erfassen. Keine Bankdaten, Passwörter oder API-Schlüssel. Eine Referenz ersetzt keine bestätigte Anbindung.'),el('button','Speichern'));form.onsubmit=async event=>{event.preventDefault();const button=form.querySelector('button');button.disabled=true;try{await api('/'+select.value+'/restaurants/'+restaurant.id+'/onboarding',{method:'PUT',body:JSON.stringify({contractStatus:contract.value,merchantReference:reference.value})});status.textContent='Gespeichert. Center-Bestellungen sind noch nicht freigeschaltet.';await load();}catch(e){status.textContent=e.message;}finally{button.disabled=false;}};card.append(form);host.append(card);}if(!data.restaurants.length)host.append(el('p','Noch keine Restaurants zugeordnet.'));}catch(e){status.textContent=e.message;}}
async function loadTables(){const host=document.getElementById('tables');host.replaceChildren();if(!select.value)return;const data=await api('/'+select.value+'/tables');for(const table of data.tables){const row=el('p',table.name+' · ');const link=el('a','Gastzugang öffnen');link.href='/center/index.html?code='+encodeURIComponent(table.qr_token);row.append(link);host.append(row);}}
async function refresh(){await load();try{await loadTables();}catch(e){status.textContent=e.message;}}
function bindForm(id,action){document.getElementById(id).onsubmit=async event=>{event.preventDefault();const form=event.currentTarget,button=form.querySelector('button');button.disabled=true;try{await action(form);status.textContent='Gespeichert.';}catch(e){status.textContent=e.message;}finally{button.disabled=false;}};}
bindForm('newCenter',async form=>{const data=await api('',{method:'POST',body:JSON.stringify({name:form.elements.name.value})});const option=el('option',data.center.name);option.value=data.center.id;select.append(option);select.value=data.center.id;form.reset();await refresh();});
bindForm('newTable',async form=>{if(!select.value)throw Error('Bitte zuerst ein Center anlegen oder auswählen.');await api('/'+select.value+'/tables',{method:'POST',body:JSON.stringify({name:form.elements.name.value})});form.reset();await loadTables();});
bindForm('enroll',async()=>{if(!select.value)throw Error('Bitte ein Center auswählen.');await api('/'+select.value+'/restaurants',{method:'PUT',body:JSON.stringify({restaurantId:document.getElementById('ownedRestaurants').value,active:true})});await load();});
async function loadOwnedRestaurants(){const token=localStorage.getItem('bringness-pos-token');if(!token)return;const r=await fetch('/api/v1/bootstrap',{headers:{authorization:'Bearer '+token}});if(!r.ok)return;const data=await r.json();const options=document.getElementById('ownedRestaurants');for(const restaurant of data.restaurants||[]){const option=el('option',restaurant.name);option.value=restaurant.id;options.append(option);}}
select.onchange=refresh;try{const data=await api('');for(const c of data.centers){const option=el('option',c.name);option.value=c.id;select.append(option);}await loadOwnedRestaurants();if(data.centers.length)await refresh();else status.textContent='Noch kein Center angelegt.';}catch(e){status.textContent=e.message;}
</script></body></html>
