<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Online POS – Bringness POS</title><link rel="stylesheet" href="/styles.css"><style>
.posapp{max-width:1400px;margin:auto;padding:28px}.authbox{max-width:520px;margin:55px auto;background:#fff;padding:30px;border-radius:22px;box-shadow:0 15px 55px #10223518}.field{display:grid;gap:6px;margin:12px 0}.field input,.field select{padding:13px;border:1px solid #d9e0e6;border-radius:10px;font:inherit}.passwordwrap{display:flex;border:1px solid #d9e0e6;border-radius:10px;overflow:hidden}.passwordwrap input{border:0!important;border-radius:0!important;flex:1;min-width:0}.eye{border:0;background:#fff;padding:0 14px;font-size:20px;cursor:pointer}.forgot{display:inline-block;margin:-2px 0 12px;color:#e75f16;font-weight:700;font-size:14px}.tabs{display:flex;gap:8px}.tabs button.active{background:#071a2b;color:#fff}.workspace{display:none}.workspace.show{display:block}.topline{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.setup{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;background:#fff;padding:18px;border-radius:18px;margin-bottom:18px}.cash{display:grid;grid-template-columns:160px 1fr 320px;gap:14px}.cats,.goods,.basket{background:#fff;border-radius:18px;padding:16px;min-height:520px}.cats button{display:block;width:100%;margin:0 0 8px;text-align:left}.goods{display:grid;grid-template-columns:repeat(3,1fr);align-content:start;gap:10px}.product{border:1px solid #edf0f2;background:#fff;padding:16px;border-radius:14px;text-align:left}.product .pic{font-size:32px}.product b,.product small{display:block;margin-top:7px}.basketline{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.total{font-size:27px;font-weight:900;margin:20px 0}.pay{width:100%;background:#ff7628;color:#fff;padding:15px}.muted{color:#617286}.manage{margin-top:18px;background:#fff;padding:18px;border-radius:18px}.manage form{display:flex;gap:8px;flex-wrap:wrap}.manage input,.manage select{padding:10px;border:1px solid #ddd;border-radius:8px}@media(max-width:900px){.cash{grid-template-columns:1fr}.cats{min-height:auto}.goods{grid-template-columns:repeat(2,1fr)}.setup{grid-template-columns:1fr}}</style></head><body>
<header><a class="brand home" href="/">Bringness <span>POS</span></a><nav><a href="/">Website</a></nav><span id="who"></span></header><div class="posapp">
<section id="auth" class="authbox"><div class="eyebrow">Online POS</div><h2 style="font-size:38px">Willkommen</h2><div class="tabs"><button id="loginTab" class="active">Anmelden</button><button id="registerTab">Konto erstellen</button></div><form id="authForm"><div id="nameField" class="field" style="display:none"><label>Name</label><input id="name"></div><div class="field"><label>E-Mail</label><input id="email" type="email" required></div><div class="field"><label>Passwort</label><div class="passwordwrap"><input id="password" type="password" minlength="6" required><button id="togglePassword" class="eye" type="button" aria-label="Passwort anzeigen" title="Passwort anzeigen">👁️</button></div></div><button id="forgotPassword" class="forgot" type="button">Passwort vergessen?</button><button class="btn" type="submit">Weiter</button><p id="authMsg" class="muted"></p></form></section>
<section id="workspace" class="workspace"><div class="topline"><div><div class="eyebrow">Bringness Online POS</div><h2 style="font-size:35px;margin:5px 0">Kasse</h2></div><button id="logout">Abmelden</button></div>
<div class="setup"><div><b>Betrieb</b><select id="restaurant"></select></div><form id="restaurantForm"><input id="restaurantName" placeholder="Neuen Betrieb anlegen"><button>Anlegen</button></form><div class="muted">Schnellverkauf ist Standard; Restaurantmodus kann später erweitert werden.</div></div>
<div class="cash"><div class="cats"><b>Kategorien</b><div id="categories"></div></div><div class="goods" id="products"></div><div class="basket"><h3>Bestellung</h3><div id="cart"></div><div class="total" id="total">0,00 €</div><button id="pay" class="pay">Zahlung abschließen</button><p id="saleMsg" class="muted"></p></div></div>
<div class="manage"><h3>Sortiment verwalten</h3><form id="catForm"><input id="catName" placeholder="Kategorie, z. B. Getränke"><button>Kategorie hinzufügen</button></form><form id="productForm" style="margin-top:10px"><input id="productName" placeholder="Produktname"><input id="productPrice" type="number" step=".01" min="0" placeholder="Preis €"><input id="productEmoji" placeholder="Bild/Emoji" value="🍽️"><select id="productCategory"></select><select id="tax"><option value="19">19 % MwSt.</option><option value="7">7 % MwSt.</option></select><button>Produkt hinzufügen</button></form></div>
</section></div><script src="/pos/app.js"></script></body></html>
