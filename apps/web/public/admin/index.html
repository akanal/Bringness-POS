<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bringness POS Admin</title><link rel="stylesheet" href="/styles.css"><style>.admin{max-width:1100px;margin:40px auto;padding:24px}.card{background:#fff;padding:22px;border-radius:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}input{padding:12px;border:1px solid #ddd;border-radius:9px;width:100%}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header><a class="brand home" href="/">Bringness <span>POS Admin</span></a><a href="/pos/">Kasse</a></header><main class="admin"><section id="login" class="card"><h1>Admin-Zugang</h1><p>Mit deinem Bringness-POS-Konto anmelden.</p><input id="email" type="email" placeholder="E-Mail"><input id="password" type="password" placeholder="Passwort" style="margin-top:8px"><button id="go" class="btn" style="margin-top:10px">Anmelden</button><p id="msg"></p></section><section id="dash" style="display:none"><h1>Bringness POS Verwaltung</h1><div class="grid"><div class="card"><h3>Betriebe</h3><strong id="restaurants">0</strong></div><div class="card"><h3>Verkäufe</h3><strong id="orders">0</strong></div><div class="card"><h3>Online-Abonnement</h3><p>29,99 € / Monat</p><button onclick="buy('online_monthly')">Mit Mollie testen</button></div><div class="card"><h3>Download-Lizenz</h3><p>399,00 € einmalig</p><button onclick="buy('download_license')">Mit Mollie testen</button></div></div><button id="out">Abmelden</button></section></main><script>let t=localStorage.getItem("bringness-pos-token");async function api(p,o={}){o.headers={"content-type":"application/json",...(t?{authorization:"Bearer "+t}:{})};let r=await fetch("/api/v1"+p,o),j=await r.json();if(!r.ok)throw Error(j.error||"Fehler");return j}async function show(){if(!t)return;try{let d=await api("/bootstrap");login.style.display="none";dash.style.display="block";restaurants.textContent=d.restaurants.length;orders.textContent=d.orders.length}catch(e){t=null;localStorage.removeItem("bringness-pos-token")}}go.onclick=async()=>{try{let j=await api("/auth/login",{method:"POST",body:JSON.stringify({email:email.value,password:password.value})});t=j.token;localStorage.setItem("bringness-pos-token",t);show()}catch(e){msg.textContent=e.message}};async function buy(planCode){try{let j=await api("/billing/checkout",{method:"POST",body:JSON.stringify({planCode})});if(j.checkoutUrl)location.href=j.checkoutUrl;else alert("Checkout konnte nicht geöffnet werden")}catch(e){alert(e.message)}};out.onclick=()=>{localStorage.removeItem("bringness-pos-token");location.reload()};show();</script></body></html>
