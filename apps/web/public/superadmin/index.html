<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bringness Superadmin</title><link rel="stylesheet" href="/styles.css"><style>main{max-width:1250px;margin:auto;padding:30px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:white;padding:20px;border-radius:18px;margin:14px 0}.big{font-size:30px;font-weight:900}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #eee}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><header><a class="brand home" href="/">Bringness <span>POS</span></a><b>Superadmin</b></header><main><div id="login" class="card"><h2>Bringness Superadmin</h2><p>Mit deinem POS-Konto anmelden. Der Zugriff funktioniert nur für ausdrücklich freigeschaltete Plattform-Administratoren.</p><input id="email" placeholder="E-Mail"><input id="password" type="password" placeholder="Passwort"><button onclick="login()">Anmelden</button><p id="msg"></p></div><section id="app" hidden><div class="grid"><div class="card"><div class="big" id="companies">–</div>Kunden</div><div class="card"><div class="big" id="restaurants">–</div>Betriebe</div><div class="card"><div class="big" id="devices">–</div>Geräte</div><div class="card"><div class="big" id="online">–</div>Online</div></div><div class="card"><h3>Kundenübersicht</h3><table><thead><tr><th>Kunde</th><th>Betriebe</th><th>Geräte</th><th>Seit</th></tr></thead><tbody id="customers"></tbody></table></div><div class="card"><h3>Alle Geräte</h3><div id="deviceList"></div></div><button onclick="localStorage.removeItem('bringness-platform-token');location.reload()">Abmelden</button></section></main><script>let token=localStorage.getItem("bringness-platform-token");async function api(p,o={}){o.headers={...(o.headers||{}),"content-type":"application/json",authorization:"Bearer "+token};let r=await fetch("/api/v1"+p,o),j=await r.json();if(!r.ok)throw Error(j.error||"Fehler");return j}async function login(){try{let r=await fetch("/api/v1/auth/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({email:email.value,password:password.value})}),j=await r.json();if(!r.ok)throw Error(j.error);token=j.token;localStorage.setItem("bringness-platform-token",token);load()}catch(e){msg.textContent=e.message}}async function load(){if(!token)return;try{let [o,c,d]=await Promise.all([api("/platform/overview"),api("/platform/customers"),api("/platform/devices")]);login.hidden=true;app.hidden=false;companies.textContent=o.companies;restaurants.textContent=o.restaurants;devices.textContent=o.devices.n;online.textContent=o.devices.online;customers.innerHTML=c.customers.map(x=>"<tr><td>"+x.name+"</td><td>"+x.restaurants+"</td><td>"+x.devices+"</td><td>"+new Date(x.created_at).toLocaleDateString()+"</td></tr>").join("");deviceList.innerHTML=d.devices.map(x=>"<p><b>"+x.name+"</b> · "+x.company+" · "+x.status+" · "+(x.last_seen_at?new Date(x.last_seen_at).toLocaleString():"nie online")+"</p>").join("")||"Keine Geräte."}catch(e){msg.textContent=e.message;localStorage.removeItem("bringness-platform-token")}}load()</script></body></html>
