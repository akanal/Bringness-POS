<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bringness Superadmin</title><link rel="stylesheet" href="/styles.css"><style>[hidden]{display:none!important}body{margin:0;background:#f5f6f7;color:#172b3d;font:17px system-ui}header{background:#101820;color:white;padding:16px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}header a{color:white}main{max-width:1100px;margin:auto;padding:20px}.card{background:white;padding:20px;border-radius:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}button,input,select{font:inherit;min-height:46px;padding:10px;box-sizing:border-box}label{display:grid;gap:6px;margin:12px 0}button{cursor:pointer}form{max-width:540px}nav{display:flex;gap:10px;flex-wrap:wrap}nav button[aria-pressed=true]{background:#101820;color:white}.row{padding:14px 0;border-bottom:1px solid #e1e5e8}small{display:block;color:#536572}#message{min-height:26px}#loginForm input{width:100%}.metric{font-size:32px;font-weight:800}.actions{display:flex;gap:10px;flex-wrap:wrap}a{overflow-wrap:anywhere}iframe{width:100%;height:75vh;border:0}details{margin:14px 0}summary{cursor:pointer;padding:12px}@media(max-width:600px){main{padding:12px}.card{padding:16px}input,select{max-width:100%}}</style></head><body><header><a href="/">Bringness</a><b>Superadmin</b><a href="/admin/">Weitere Verwaltung</a><button id="logout" hidden>Abmelden</button></header><main><section id="login" class="card"><h1>Zentrale Steuerung</h1><p>Für ausdrücklich freigeschaltete Bringness-Superadmins.</p><form id="loginForm"><label>E-Mail<input name="email" type="email" autocomplete="username" required></label><label>Passwort<input name="password" type="password" autocomplete="current-password" required></label><button type="button" id="eye" aria-pressed="false">Passwort anzeigen</button><button type="submit">Anmelden</button></form><a href="/admin/">Passwort vergessen?</a></section><p id="message" role="status" aria-live="polite"></p><section id="app" hidden><nav aria-label="Systeme"><button data-view="overview" aria-pressed="true">Übersicht</button><button data-view="displays" aria-pressed="false">Bildschirme</button><button data-view="personnel" aria-pressed="false">Personal</button><button data-view="center" aria-pressed="false">Center</button></nav><label id="venueLabel" hidden>Betrieb auswählen<select id="venue"></select></label><div id="content"></div></section></main><script src="/personnel-report.js"></script><script src="/superadmin/systems.js"></script></body></html>
