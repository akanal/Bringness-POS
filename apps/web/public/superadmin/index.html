eckbox]){display:flex;align-items:flex-start;gap:10px}.marketplace-admin nav{margin-left:0}.marketplace-admin summary,.marketplace-admin article{overflow-wrap:anywhere}</style></head><body><header><a href="/">Bringness</a><b>Superadmin</b><a href="/admin/">Weitere Verwaltung</a><button id="logout" hidden>Abmelden</button></header><main><section id="login" class="card"><h1>Zentrale Steuerung</h1><p>Für ausdrücklich freigeschaltete Bringness-Superadmins.</p><form id="loginForm"><label>E-Mail<input name="email" type="email" autocomplete="username" required></label><label>Passwort<input name="password" type="password" autocomplete="current-password" required></label><button type="button" id="eye" aria-pressed="false">Passwort anzeigen</button><button type="submit">Anmelden</button></form><a href="/admin/">Passwort vergessen?</a></section><p id="message" role="status" aria-live="polite"></p><section id="app" hidden><nav aria-label="Systeme"><button data-view="overview" aria-pressed="false">Übersicht</button><button data-view="marketplace" aria-pressed="true">Marktplatz</button><button data-view="displays" aria-pressed="false">Bildschirme</button><button data-view="personnel" aria-pressed="false">Personal</button><button data-view="center" aria-pressed="false">Center</button></nav><label id="venueLabel" hidden>Betrieb auswählen<select id="venue"></select></label><div id="content"></div></section></main><script src="/personnel-report.js"></script><script src="/pos/displays.js?v=pickup-clear-deposit-20261102"></script><script src="/superadmin/systems.js?v=marketplace-filters-20261106"></script></body></html>
