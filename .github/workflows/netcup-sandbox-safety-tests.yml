name: Netcup sandbox safety tests
on:
  push:
    branches: [netcup-isolated-mollie-sandbox-20261015]
    paths:
      - 'ops/select-operation.js'
      - 'ops/select-operation.test.js'
      - 'ops/netcup-sandbox-preflight.sh'
      - 'ops/netcup-sandbox-preflight.test.py'
      - 'ops/netcup-sandbox-dispatcher.sh'
      - 'ops/netcup-sandbox-dispatcher.test.py'
      - 'ops/netcup-sandbox.compose.yml'
      - 'ops/netcup-sandbox.Dockerfile'
      - 'ops/netcup-sandbox-compose.test.py'
      - '.github/workflows/netcup-sandbox-safety-tests.yml'
  pull_request:
    paths:
      - 'ops/select-operation.js'
      - 'ops/select-operation.test.js'
      - '.github/workflows/netcup-sandbox-safety-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: node --test ops/select-operation.test.js
      - run: bash -n ops/netcup-sandbox-preflight.sh
      - run: python3 ops/netcup-sandbox-preflight.test.py
      - run: bash -n ops/netcup-sandbox-dispatcher.sh
      - run: python3 ops/netcup-sandbox-dispatcher.test.py
      - run: python3 ops/netcup-sandbox-compose.test.py
      - run: docker compose -f ops/netcup-sandbox.compose.yml config --quiet
