name: IDrive encrypted archive validation
on:
  pull_request:
    paths:
      - 'ops/idrive-*'
      - 'ops/configure-idrive-*'
      - 'ops/bringness-idrive-*'
      - '.github/workflows/idrive-archive-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  encrypted-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check -r ops/idrive-archive-requirements.txt
      - name: Synthetic security and encryption tests
        run: |
          python ops/configure-idrive-documents.test.py
          python ops/configure-idrive-app.test.py
          bash -n ops/enable-idrive-app.sh
          python ops/idrive-archive.test.py
          python ops/idrive-connect.test.py
          bash -n ops/idrive-archive-install.sh
          bash -n ops/idrive-connect.sh
      - name: Real isolated PostgreSQL restore and PDF archive
        run: |
          docker pull postgres:16
          python ops/idrive-archive-smoke.py
