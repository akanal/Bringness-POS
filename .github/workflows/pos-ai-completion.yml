name: POS and AI completion validation
on:
  pull_request:
    paths: ["server/**", "apps/desktop/**", "apps/web/public/accountant*", "apps/web/public/pos/tax-export.js", "apps/web/public/ai-workspace.js", ".github/workflows/pos-ai-completion.yml"]
  push:
    branches: [main, 'finish/**']
    paths: ["server/**", "apps/desktop/**", "apps/web/public/accountant*", "apps/web/public/pos/tax-export.js", "apps/web/public/ai-workspace.js", ".github/workflows/pos-ai-completion.yml"]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: device_test
          POSTGRES_PASSWORD: device_test
          POSTGRES_DB: bringness_device_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U device_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix server/ai-tests --ignore-scripts --no-audit --no-fund
      - run: node --test server/billing-policy.test.js server/billing-status.test.js server/billing-quote.test.js server/platform-ai-gateway.test.js server/ai-demand-core.test.js server/ai-forecast-core.test.js server/ai-planning-core.test.js server/ai-procurement-core.test.js
      - run: node server/ai-tests/transactional-mail.mjs
      - run: node server/ai-tests/displays.mjs
      - run: node server/ai-tests/billing-eligibility.mjs
      - run: node server/ai-tests/remote-support.mjs
      - run: node server/ai-tests/admin-audit.mjs
      - run: node server/ai-tests/device-license.mjs
      - name: Verify simultaneous device activation on PostgreSQL
        run: node server/ai-tests/device-license.mjs
        env:
          DEVICE_TEST_DATABASE_URL: postgres://device_test:device_test@localhost:5432/bringness_device_test
      - run: node server/ai-tests/offline-ui.mjs
      - run: node server/ai-tests/offline-accountant.mjs
      - run: node server/ai-tests/automatic-policy.mjs
      - run: node server/ai-tests/consumption-history.mjs
      - run: node server/ai-tests/stock-lifecycle.mjs
      - run: node server/ai-tests/pos-stock-bridge.mjs
      - run: node server/ai-tests/integration.mjs
