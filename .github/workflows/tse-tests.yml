name: TSE regression tests
on:
  push:
    branches:
      - feature/tse-integration-prep-20261016
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tse-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tse_test
          POSTGRES_PASSWORD: tse_test
          POSTGRES_DB: tse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tse_test -d tse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run all TSE tests
        run: node --test tests/tse*.test.js
      - name: Run PostgreSQL integration tests
        env:
          TSE_TEST_DATABASE_URL: postgres://tse_test:tse_test@localhost:5432/tse_test
        run: node --test tests/tse-postgres-integration.test.js
