name: Shop payment safety tests
on:
  pull_request:
    paths:
      - 'server/merchant-customer-numbers*.js'
      - 'server/billing-mail.js'
      - 'ops/sql/verify-merchant-customer-numbers.sql'
      - 'server/shop-payment-*.js'
      - 'server/shop-mollie-*.js'
      - 'server/shop-document-*.js'
      - 'server/shop-credit-note-*.js'
      - 'server/shop-invoice-*.js'
      - 'server/shop-document-archive-*.js'
      - '.github/workflows/shop-payment-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  payment-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: checkout_test
          POSTGRES_PASSWORD: checkout_test
          POSTGRES_DB: bringness_checkout_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U checkout_test -d bringness_checkout_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MARKET_CHECKOUT_TEST_DATABASE_URL: postgres://checkout_test:checkout_test@127.0.0.1:5432/bringness_checkout_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      # PGlite is test-only; keep it out of the production dependency graph.
      - run: npm install --no-save --package-lock=false --ignore-scripts @electric-sql/pglite@0.3.14
      - name: Payment and refund safety suites
        run: node --test server/merchant-customer-numbers.test.js server/shop-payment-*.test.js server/shop-mollie-*.test.js server/shop-document-*.test.js server/shop-credit-note-*.test.js server/shop-invoice-*.test.js
