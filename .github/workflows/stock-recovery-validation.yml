name: Isolated stock recovery validation
on:
  workflow_dispatch:
  push:
    branches: ['test/stock-recovery-validation-20261021']
    paths: ['.github/workflows/stock-recovery-validation.yml']
permissions:
  contents: read
jobs:
  stock-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: device_test
          POSTGRES_PASSWORD: device_test
          POSTGRES_DB: bringness_device_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U device_test -d bringness_device_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix server/ai-tests --ignore-scripts --no-audit --no-fund
      - name: Verify actual concurrent stock authorization locks
        run: node server/ai-tests/stock-authority-races.mjs
        env:
          STOCK_AUTH_TEST_DATABASE_URL: postgres://device_test:device_test@localhost:5432/bringness_device_test
      - name: Verify actual concurrent sales ledger transactions
        run: node server/ai-tests/sales-ledger-races.mjs
        env:
          STOCK_AUTH_TEST_DATABASE_URL: postgres://device_test:device_test@localhost:5432/bringness_device_test
      - name: Verify recovery failure simulations
        run: node --test server/stock-recovery-regression.test.js server/offline-stock.test.js
      - name: Verify lifecycle and replay against isolated embedded databases
        run: |
          node server/ai-tests/stock-lifecycle.mjs
          node server/ai-tests/pos-stock-bridge.mjs
      - name: Verify complete AI flow and transaction failure rollback
        run: node server/ai-tests/integration.mjs
