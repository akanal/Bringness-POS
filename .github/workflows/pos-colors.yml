name: POS colour and navigation validation
on:
  pull_request:
    paths: ['apps/web/public/pos/**', 'server/pos-colors-browser.mjs', '.github/workflows/pos-colors.yml']
  push:
    branches: [main]
    paths: ['apps/web/public/pos/**', 'server/pos-colors-browser.mjs', '.github/workflows/pos-colors.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --prefix "$RUNNER_TEMP/colour-deps" --no-save playwright@1.62.1
      - run: node "$RUNNER_TEMP/colour-deps/node_modules/playwright/cli.js" install --with-deps ${{ matrix.browser }}
      - run: node server/pos-colors-browser.mjs
        env:
          CENTER_TEST_BROWSER: ${{ matrix.browser }}
          CENTER_TEST_PLAYWRIGHT: ${{ runner.temp }}/colour-deps/node_modules/playwright/index.mjs
