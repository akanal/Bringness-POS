name: Build Windows Desktop
on:
  workflow_dispatch:
  pull_request:
    paths: ["apps/desktop/**", ".github/workflows/windows-desktop.yml"]
  push:
    branches: [main, 'finish/**']
    paths: ["apps/desktop/**", ".github/workflows/windows-desktop.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults: {run: {working-directory: apps/desktop}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm ci
      - run: npm test
      - run: node --check main.cjs
      - run: npm run prepare:offline
      - name: Verify offline cash UI and native IPC isolation
        run: npx electron offline-smoke.cjs
      - name: Verify native remote support consent, capture, input and stop
        run: npx electron support-smoke.cjs
      - run: npm run build
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      - name: Verify Windows installer output and checksum
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem dist/*.exe -ErrorAction Stop)
          if ($installers.Count -eq 0) { throw "Windows installer missing" }
          foreach ($installer in $installers) {
            if ($installer.Length -lt 1048576) { throw "Windows installer unexpectedly small: $($installer.Name)" }
            $digest = Get-FileHash -Path $installer.FullName -Algorithm SHA256
            if ($digest.Hash -notmatch '^[0-9A-F]{64}$') { throw "Invalid installer SHA256" }
            "Installer: $($installer.Name), bytes: $($installer.Length), SHA256: $($digest.Hash)" >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Verify installer signature
        id: signature
        shell: pwsh
        env:
          CERT_CONFIGURED: ${{ secrets.WINDOWS_CSC_LINK != '' }}
        run: |
          $files = Get-ChildItem dist/*.exe
          if (-not $files) { throw "No installer was built" }
          $valid = $true
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne "Valid") { $valid = $false }
          }
          if ($env:CERT_CONFIGURED -eq "true" -and -not $valid) { throw "Configured signing did not produce a valid installer signature" }
          "signed=$($valid.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if (-not $valid) { "Unsigned test build only; public installer was not replaced." >> $env:GITHUB_STEP_SUMMARY }
      - name: Publish latest installer asset
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.signature.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: Bringness POS Windows
          prerelease: true
          make_latest: false
          files: apps/desktop/dist/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Bringness-POS-Windows-signed-${{ steps.signature.outputs.signed }}
          path: apps/desktop/dist/*.exe
