name: Build Windows Desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["apps/desktop/**", ".github/workflows/windows-desktop.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults: {run: {working-directory: apps/desktop}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install
      - run: npm run build
      - name: Publish latest installer asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: Bringness POS Windows
          prerelease: true
          make_latest: false
          files: apps/desktop/dist/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Bringness-POS-Windows
          path: apps/desktop/dist/*.exe
