name: Electron cloud sync recovery
on:
  push:
    branches: ['staging/preview-20261016', 'finish/**']
    paths: ['apps/desktop/**', 'server/offline-sales.js', 'server/offline-sale-core.js', 'server/pos-stock-bridge-core.js', 'server/ai-tests/offline-http-fixture.mjs', 'db/schema.sql', '.github/workflows/offline-cloud-validation.yml']
  pull_request:
    paths: ['apps/desktop/**', 'server/offline-sales.js', 'server/offline-sale-core.js', 'server/pos-stock-bridge-core.js', 'server/ai-tests/offline-http-fixture.mjs', 'db/schema.sql', '.github/workflows/offline-cloud-validation.yml']
permissions:
  contents: read
jobs:
  electron-real-http:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 24}
      - name: Install actual cloud handler dependencies
        working-directory: .
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install isolated PostgreSQL test engine
        working-directory: server/ai-tests
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install actual Windows Electron runtime
        run: npm ci --no-audit --no-fund
      - name: Prepare shared offline sale contract
        run: npm run prepare:offline
      - name: Verify desktop persistence and synchronization unit cases
        run: npm test
      - name: Verify actual Electron IPC and HTTP server recovery across connection loss
        run: npx electron offline-cloud-smoke.cjs
