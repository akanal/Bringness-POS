name: POS release validation
on:
  push:
    branches:
      - 'finish/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check critical server syntax
        run: |
          node --check server/tse-integration.js
          node --check server/tse-signing-worker.js
          node --check server/offline-sales.js
          node --check server/center.js
      - name: Run TSE regression tests
        run: node --test tests/tse-signing-worker.test.js tests/offline-sale-core.test.js tests/center-guest-push.test.js tests/tse-core.test.js
